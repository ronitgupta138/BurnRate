name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary
        if: runner.os != 'Windows'
        run: strip "target/${{ matrix.target }}/release/burnrate"

      - name: Package release archive
        shell: bash
        run: |
          set -euo pipefail

          BIN_NAME="burnrate"
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN_NAME="burnrate.exe"
            ARCHIVE="burnrate-${{ github.ref_name }}-${{ matrix.target }}.zip"
          else
            ARCHIVE="burnrate-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          fi

          STAGING="burnrate-staging"
          rm -rf "${STAGING}"
          mkdir -p "${STAGING}"

          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "${STAGING}/"
          if [ -f "README.md" ]; then cp "README.md" "${STAGING}/"; fi
          if [ -f "LICENSE" ]; then cp "LICENSE" "${STAGING}/"; fi

          if [ "${{ runner.os }}" = "Windows" ]; then
            if command -v 7z >/dev/null 2>&1; then
              (cd "${STAGING}" && 7z a "../${ARCHIVE}" *)
            else
              powershell -Command "Compress-Archive -Path '${STAGING}/*' -DestinationPath '${ARCHIVE}'"
            fi
          else
            (cd "${STAGING}" && tar -czf "../${ARCHIVE}" *)
          fi

          rm -rf "${STAGING}"

      - name: Compute SHA256 checksum
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ runner.os }}" = "Windows" ]; then
            ARCHIVE="burnrate-${{ github.ref_name }}-${{ matrix.target }}.zip"
          else
            ARCHIVE="burnrate-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          fi
          CHECKSUM="burnrate-${{ github.ref_name }}-${{ matrix.target }}.sha256"

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE}" > "${CHECKSUM}"
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${ARCHIVE}" > "${CHECKSUM}"
          else
            powershell -Command "(Get-FileHash -Algorithm SHA256 '${ARCHIVE}').Hash.ToLower() + '  ${ARCHIVE}'" > "${CHECKSUM}"
          fi

          echo "Checksum generated in ${CHECKSUM}:"
          cat "${CHECKSUM}"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            burnrate-${{ github.ref_name }}-${{ matrix.target }}.*
          generate_release_notes: true
          fail_on_unmatched_files: true
