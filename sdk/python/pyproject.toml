[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "burnrate-agent"
version = "0.5.0"
description = "Terminal HUD, Hard Spend Caps & Cache Guard for Coding Agents"
readme = "README.md"
authors = [{ name = "Ronit Gupta", email = "ronitgupta138@gmail.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
keywords = ["ai-agents", "finops", "prompt-caching", "budget-guard"]
requires-python = ">=3.9"

[project.urls]
Homepage = "https://github.com/ronitgupta138/burnrate"
Repository = "https://github.com/ronitgupta138/burnrate"
