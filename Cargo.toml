[package]
name = "burnrate-agent"
version = "2.0.0"
edition = "2024"
authors = ["Ronit Gupta <ronitgupta138@gmail.com>"]
description = "Terminal HUD, Hard Spend Caps & Prompt-Cache Guard for AI Coding Agents in Rust"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ronitgupta138/burnrate"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
thiserror = "2.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
regex = "1.13.1"

[[bin]]
name = "burnrate"
path = "src/main.rs"

[lib]
name = "burnrate"
path = "src/lib.rs"
